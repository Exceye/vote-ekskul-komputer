<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Pemilu Ekskul</title>
    <!-- Kita pakai Chart.js untuk membuat grafik lingkaran (Pie Chart) yang keren -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; background: #f4f7f6; text-align: center; }
        .dashboard { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .chart-container { width: 100%; max-width: 400px; margin: auto; }
        h1 { color: #333; }
        .stat-box { display: flex; justify-content: space-around; margin: 20px 0; padding: 15px; background: #e9ecef; border-radius: 8px; }
        .stat-item h2 { margin: 0; color: #007bff; font-size: 30px; }
        .stat-item p { margin: 5px 0 0; font-size: 14px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Dashboard Admin Pemilu</h1>
        
        <div class="stat-box">
            <div class="stat-item">
                <h2 id="total-suara">0</h2>
                <p>Total Suara Masuk</p>
            </div>
            <!-- Nanti kita bisa tambah tombol Generate Token di sini -->
        </div>

        <h3>Perolehan Suara Sementara</h3>
        <div class="chart-container">
            <!-- Tempat Grafik akan muncul -->
            <canvas id="voteChart"></canvas>
        </div>
    </div>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
