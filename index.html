<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemilihan Ketua Ekskul Komputer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="container">
        <!-- Tambahkan baris img ini di atas tag h1 -->
        <img src="assets/logo.png" alt="Logo Ekskul Komputer" class="logo">
        <h1>Pemilu Ekskul Komputer 2026</h1>
        
        <!-- Form Login -->
        <div id="login-section">
            <p>Masukkan Nama dan Token dari panitia.</p>
            <input type="text" id="input-nama" placeholder="Nama Lengkap" required>
            <input type="text" id="input-token" placeholder="Kode Token (Contoh: EXKUL123)" required>
            <button id="btn-login">Masuk & Mulai Vote</button>
            <p id="login-error" class="error-msg hidden"></p>
        </div>

        <!-- Area Voting (Disembunyikan di awal) -->
        <div id="vote-section" class="hidden">
            <h2 id="welcome-msg">Selamat datang!</h2>
            <p>Silakan pilih calon ketua ekskul:</p>
            
            <div class="candidate-list">
                <button class="btn-vote" data-paslon="1">1. Paslon Satu</button>
                <button class="btn-vote" data-paslon="2">2. Paslon Dua</button>
                <button class="btn-vote" data-paslon="3">3. Paslon Tiga</button>
            </div>

            <button id="btn-logout" class="btn-danger">Keluar</button>
        </div>
    </div>

    <!-- Script Firebase & Logika -->
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/voter.js"></script>
</body>
</html>
